<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#0a0a12">
    <meta name="robots" content="noindex, nofollow">
    <title>For Mika | OpenScientific</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600&family=Outfit:wght@500;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/styles.css">
    <link rel="stylesheet" href="css/mika.css">
    <script src="js/mika.js" defer></script>
</head>
<body class="mika-page">
    <a class="mika-brand" href="index.html" aria-label="OpenScientific home">Open<span class="highlight">Scientific</span></a>
    <main class="mika-shell">
        <section class="mika-panel" id="mika-question" aria-labelledby="mika-heading">
            <div class="mika-heart" aria-hidden="true">
                <svg viewBox="0 0 64 64" fill="none"><path d="M32 51 12.5 32C-2 16 19 1 32 18 45 1 66 16 51.5 32Z" stroke="currentColor" stroke-width="2" stroke-linejoin="round"/></svg>
                <span class="mika-orbit-dot"></span>
            </div>
            <p class="mika-greeting">Hello Mika,</p>
            <p class="mika-message">just so you know, <span>I love you.</span></p>
            <h1 id="mika-heading">Will you be my girlfriend?</h1>
            <div class="mika-choices" id="mika-choices">
                <button class="btn-primary mika-answer mika-yes" id="mika-yes" type="button">Yes</button>
                <button class="btn-secondary mika-answer mika-no" id="mika-no" type="button">No</button>
            </div>
            <p class="mika-sr-only" id="mika-status" role="status" aria-live="polite"></p>
            <noscript><p class="mika-noscript">Please enable JavaScript to open this surprise.</p></noscript>
        </section>

        <section class="mika-panel mika-success" id="mika-success" aria-labelledby="mika-thanks" hidden>
            <div class="mika-heart mika-heart-filled" aria-hidden="true">
                <svg viewBox="0 0 64 64"><path d="M32 51 12.5 32C-2 16 19 1 32 18 45 1 66 16 51.5 32Z" fill="currentColor"/></svg>
                <span class="mika-orbit-dot"></span>
            </div>
            <h1 id="mika-thanks" tabindex="-1">Thank you for making my day love.</h1>
            <p class="mika-next">if you wanna know about temperature I made this for you</p>
            <a class="btn-primary mika-temperature-link" href="temperature.html">Click here.</a>
        </section>
    </main>
</body>
</html>
